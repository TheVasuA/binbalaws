services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binbalaws-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - web-network

  nginx:
    image: nginx:alpine
    container_name: binbalaws-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-data:/var/www/certbot:ro
    networks:
      - web-network
      - chartapnext-api_default
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    container_name: binbalaws-certbot
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot-data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
  chartapnext-api_default:
    external: true
